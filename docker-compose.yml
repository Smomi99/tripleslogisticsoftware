services:
  postgres:
    image: postgres:16-alpine
    container_name: ff-erp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ff_erp
      POSTGRES_PASSWORD: ff_erp_dev
      POSTGRES_DB: ff_erp
      # Deterministic collation so ORDER BY on names is stable across machines.
      POSTGRES_INITDB_ARGS: '--locale-provider=icu --icu-locale=en-US --encoding=UTF8'
    ports:
      - '5432:5432'
    volumes:
      - ff-erp-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ff_erp -d ff_erp']
      interval: 5s
      timeout: 5s
      retries: 10

  # A mail server that never delivers anything.
  #
  # Everything the product sends — an inquiry to an agent, a portal invite, a
  # password reset, a quote notification — lands in a web inbox at
  # http://localhost:8025 instead of a real mailbox. That is the only honest way
  # to check the wording and the links without emailing an actual agent, and it
  # means a developer can never accidentally send a customer a test message.
  #
  # No credentials: Mailpit accepts anything on 1025, which is why the API's
  # SMTP_USER and SMTP_PASS are optional.
  mailpit:
    image: axllent/mailpit:latest
    container_name: ff-erp-mailpit
    restart: unless-stopped
    ports:
      - '1025:1025' # SMTP, for the API
      - '8025:8025' # the inbox, for you
    environment:
      MP_MAX_MESSAGES: 500
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

  # An S3-compatible bucket on your own machine.
  #
  # Production stores files in Cloudflare R2. R2 has no local emulator, and
  # pointing a developer at the real bucket means test uploads land in the same
  # place as an operator's signed agency agreements. MinIO speaks the same S3
  # API, so the driver exercised here is the driver that runs in production —
  # not a mock of it.
  #
  # Off by default; it is only needed when working on file upload:
  #   docker compose --profile storage up -d minio
  #   pnpm --filter @ff/api storage:check
  #
  # Console at http://localhost:9001 (ff_minio / ff_minio_dev).
  minio:
    image: minio/minio:latest
    container_name: ff-erp-minio
    profiles: ['storage']
    restart: unless-stopped
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: ff_minio
      MINIO_ROOT_PASSWORD: ff_minio_dev
    ports:
      - '9000:9000' # the S3 API
      - '9001:9001' # the console
    volumes:
      - ff-erp-minio:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 10

  # Creates the bucket and exits. MinIO does not make one for you, and a
  # missing bucket is the failure storage:check is meant to catch, not cause.
  minio-init:
    image: minio/mc:latest
    profiles: ['storage']
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ff_minio ff_minio_dev &&
      mc mb --ignore-existing local/ff-erp-files &&
      echo 'bucket ff-erp-files ready'"

volumes:
  ff-erp-pgdata:
  ff-erp-minio:
